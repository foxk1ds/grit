<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151922" />
      <stop offset="50%" stop-color="#10131a" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>

    <!-- Squircle Border Stroke Gradient -->
    <linearGradient id="bgBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#2ec27e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1c2536" stop-opacity="0.6" />
    </linearGradient>

    <!-- Shield Primary Rim Gradient -->
    <linearGradient id="shieldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62a0ea" />
      <stop offset="35%" stop-color="#3584e4" />
      <stop offset="70%" stop-color="#26a269" />
      <stop offset="100%" stop-color="#2ec27e" />
    </linearGradient>

    <!-- Shield Inner Body Gradient (Left/Right 3D Facet) -->
    <linearGradient id="shieldBodyLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="shieldBodyRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151e2d" />
      <stop offset="100%" stop-color="#0a0f18" />
    </linearGradient>

    <!-- Terminal Chevron Neon Gradient -->
    <linearGradient id="terminalChevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57e389" />
      <stop offset="100%" stop-color="#2ec27e" />
    </linearGradient>

    <!-- Cyber Cyan Accent Gradient -->
    <linearGradient id="cyberCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78aeed" />
      <stop offset="100%" stop-color="#3584e4" />
    </linearGradient>

    <!-- Radial Glow Behind Shield -->
    <radialGradient id="shieldBackGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#3584e4" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#2ec27e" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10131a" stop-opacity="0" />
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container (GNOME HIG Style) -->
  <rect x="28" y="28" width="456" height="456" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#bgBorderGrad)" stroke-width="3" filter="url(#dropShadow)" />

  <!-- Subtle Cyber Matrix / Coordinate Lines -->
  <g opacity="0.12" stroke="#62a0ea" stroke-width="1.5">
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="130" fill="none" stroke-dasharray="4 6" />
    <line x1="256" y1="60" x2="256" y2="452" stroke-dasharray="4 6" />
    <line x1="60" y1="256" x2="452" y2="256" stroke-dasharray="4 6" />
    <line x1="120" y1="120" x2="392" y2="392" stroke-dasharray="2 8" />
    <line x1="392" y1="120" x2="120" y2="392" stroke-dasharray="2 8" />
  </g>

  <!-- Ambient Blue/Green Glow -->
  <ellipse cx="256" cy="245" rx="170" ry="170" fill="url(#shieldBackGlow)" />

  <!-- Shield Group -->
  <g filter="url(#dropShadow)">
    <!-- Outer Shield Rim / Trim -->
    <path d="M 256,92 
             C 328,92 388,118 404,148
             C 404,272 356,368 256,420
             C 156,368 108,272 108,148
             C 124,118 184,92 256,92 Z"
          fill="none" 
          stroke="url(#shieldRimGrad)" 
          stroke-width="14" 
          stroke-linejoin="round" />

    <!-- Inner Shield Body - Left Facet (Lighted) -->
    <path d="M 256,104 
             C 200,104 146,126 122,154
             C 122,260 164,346 256,398
             L 256,104 Z"
          fill="url(#shieldBodyLeft)" />

    <!-- Inner Shield Body - Right Facet (Shaded) -->
    <path d="M 256,104 
             C 312,104 366,126 390,154
             C 390,260 348,346 256,398
             L 256,104 Z"
          fill="url(#shieldBodyRight)" />

    <!-- Shield Center Ridge Line -->
    <line x1="256" y1="104" x2="256" y2="398" stroke="#3584e4" stroke-opacity="0.35" stroke-width="2" />
  </g>

  <!-- Concentric Cyber Rings (Radar / Scanner Pulse) -->
  <g opacity="0.45">
    <circle cx="256" cy="244" r="88" fill="none" stroke="url(#cyberCyanGrad)" stroke-width="2" stroke-dasharray="14 10" />
    <circle cx="256" cy="244" r="62" fill="none" stroke="url(#terminalChevronGrad)" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <!-- Sentinel Emblem: Fortress Keyhole + Linux Terminal Chevron & Cursor -->
  <g id="sentinel-core">
    <!-- Outer Sentinel Ring / Shackle Arc -->
    <path d="M 216,212
             C 216,188 234,170 256,170
             C 278,170 296,188 296,212
             L 296,224
             L 216,224 Z"
          fill="none"
          stroke="url(#cyberCyanGrad)"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Terminal Chevron '>' (Cybersecurity Command Guard Motif) -->
    <path d="M 218,220 
             L 258,252 
             L 218,284"
          fill="none"
          stroke="url(#terminalChevronGrad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#neonGlow)" />

    <!-- Terminal Prompt Underscore Cursor '_' -->
    <line x1="272" y1="284" x2="304" y2="284" 
          stroke="#57e389" 
          stroke-width="11" 
          stroke-linecap="round"
          filter="url(#neonGlow)" />

    <!-- Defense Nodes / Connection Dots -->
    <circle cx="256" cy="336" r="6.5" fill="#33d17a" filter="url(#neonGlow)" />
    <circle cx="204" cy="316" r="4.5" fill="#3584e4" />
    <circle cx="308" cy="316" r="4.5" fill="#3584e4" />
    <line x1="204" y1="316" x2="256" y2="336" stroke="#3584e4" stroke-opacity="0.4" stroke-width="2" />
    <line x1="308" y1="316" x2="256" y2="336" stroke="#3584e4" stroke-opacity="0.4" stroke-width="2" />
  </g>

  <!-- Top Glass Highlight Rim (Gloss Reflection) -->
  <path d="M 52,112 
           C 52,68 88,40 132,40 
           L 380,40 
           C 424,40 460,68 460,112
           C 460,116 456,120 448,118
           C 360,94 152,94 64,118
           C 56,120 52,116 52,112 Z"
        fill="#ffffff"
        opacity="0.08" />
</svg>
